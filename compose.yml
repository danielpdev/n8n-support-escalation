services:
  mock:
    build: .
    ports: ["127.0.0.1:8114:8000"]
    environment:
      DATABASE_URL: sqlite:////state/demo.sqlite
    volumes: ["mock-data:/state"]
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.7@sha256:9a8d8dcea75667496695d7810d7e1fe018a65efb36cc499d347f3931b3957b5d
    ports: ["127.0.0.1:5680:5678"]
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
    volumes: ["n8n-data:/home/node/.n8n", "./workflows:/workflows:ro"]
    depends_on: [mock]
volumes:
  mock-data:
  n8n-data:
